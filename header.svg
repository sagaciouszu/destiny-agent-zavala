<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Zavala - Agent Brain / Wrapper">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="50%" stop-color="#0a1626"/>
      <stop offset="100%" stop-color="#12233d"/>
    </linearGradient>
    <radialGradient id="blueglow" cx="0.85" cy="0.5" r="0.42">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="steelglow" cx="0.12" cy="0.55" r="0.35">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="textblur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.85">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="accentfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="30%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#space)"/>
  <rect width="1200" height="320" fill="url(#blueglow)"/>
  <rect width="1200" height="320" fill="url(#steelglow)"/>

  <!-- city lights -->
  <g fill="#bfdbfe">
    <circle cx="120" cy="60" r="1.1" opacity="0.6"/>
    <circle cx="250" cy="180" r="0.9" opacity="0.45"/>
    <circle cx="360" cy="90" r="1.2" opacity="0.65"/>
    <circle cx="480" cy="230" r="0.9" opacity="0.45"/>
    <circle cx="580" cy="80" r="1" opacity="0.55"/>
    <circle cx="680" cy="260" r="1.1" opacity="0.6"/>
    <circle cx="760" cy="100" r="0.8" opacity="0.45"/>
    <circle cx="840" cy="240" r="1" opacity="0.55"/>
    <circle cx="90" cy="250" r="0.9" opacity="0.45"/>
    <circle cx="150" cy="130" r="1" opacity="0.55"/>
    <circle cx="320" cy="280" r="1" opacity="0.55"/>
    <circle cx="620" cy="160" r="0.7" opacity="0.4"/>
    <circle cx="420" cy="120" r="1.1" opacity="0.6"/>
    <circle cx="190" cy="200" r="0.7" opacity="0.4"/>
  </g>

  <g stroke="#60a5fa" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- Ward sigil (right): ring, bulwark chevron, foundation bar -->
  <g transform="translate(980,160)" opacity="0.85" fill="none" stroke="#60a5fa">
    <circle r="98" stroke-width="1.2" opacity="0.45"/>
    <circle r="82" stroke-width="0.7" opacity="0.3"/>
    <path d="M -52 -34 L 0 18 L 52 -34" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" opacity="0.85"/>
    <path d="M -52 -4 L 0 48 L 52 -4" stroke-width="2.5" opacity="0.55"/>
    <line x1="-58" y1="72" x2="58" y2="72" stroke-width="1.4" opacity="0.7"/>
    <circle r="3.5" fill="#dbeafe" stroke="none" opacity="0.9"/>
    <circle cx="-64" cy="-64" r="2" fill="#dbeafe" stroke="none" opacity="0.6"/>
    <circle cx="64" cy="64" r="2" fill="#dbeafe" stroke="none" opacity="0.6"/>
  </g>

  <!-- Reticle -->
  <g fill="none" stroke="#60a5fa">
    <circle cx="980" cy="160" r="112" stroke-width="0.7" opacity="0.18"/>
  </g>

  <!-- Title block (left) -->
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" filter="url(#textblur)" opacity="0.7">
    <text x="60" y="90" font-size="18" font-weight="500" fill="#000000" letter-spacing="8">[ COMMANDER  ·  CITY  ·  DUTY ]</text>
    <text x="60" y="150" font-size="66" font-weight="700" fill="#000000" letter-spacing="2">ZAVALA</text>
    <text x="60" y="200" font-size="20" font-weight="500" fill="#000000" letter-spacing="5">AGENT BRAIN  /  WRAPPER</text>
    <text x="62" y="230" font-size="15" font-weight="400" fill="#000000" letter-spacing="4">WE WILL HOLD.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif">
    <text x="60" y="90" font-size="18" font-weight="500" fill="#60a5fa" letter-spacing="8">[ COMMANDER  ·  CITY  ·  DUTY ]</text>
    <text x="60" y="150" font-size="66" font-weight="700" fill="#eff6ff" letter-spacing="2">ZAVALA</text>
    <text x="60" y="200" font-size="20" font-weight="500" fill="#93c5fd" letter-spacing="5">AGENT BRAIN  /  WRAPPER</text>
    <text x="62" y="230" font-size="15" font-weight="400" fill="#8a8a8a" letter-spacing="4">WE WILL <tspan x="166" fill="#60a5fa">HOLD.</tspan></text>
  </g>

  <rect x="60" y="172" width="400" height="1.5" fill="url(#accentfade)"/>

  <text transform="translate(1184, 243) rotate(-90)" font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" font-size="8" font-weight="500" letter-spacing="2" fill="#60a5fa" opacity="0.25">LAST CITY  ·  TOWER  ·  EARTH</text>

  <g fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.5">
    <path d="M 24 46 L 24 24 L 46 24"/>
    <path d="M 1176 274 L 1176 296 L 1154 296"/>
  </g>

  <rect width="360" height="320" fill="url(#leftfade)"/>
  <rect width="1200" height="320" fill="url(#vig)" pointer-events="none"/>
</svg>
