<path d="M19.233 9.934c-0.405 0.479-0.798 0.944-1.19 1.407q-0.782 0.923-1.565 1.845-0.726 0.855-1.454 1.708-0.774 0.912-1.544 1.824c-0.204 0.24-0.411 0.477-0.612 0.719-0.066 0.080-0.11 0.069-0.17-0.004-0.406-0.49-0.813-0.981-1.224-1.467-0.248-0.294-0.507-0.577-0.755-0.871-0.305-0.36-0.6-0.727-0.905-1.087s-0.621-0.711-0.926-1.070-0.6-0.726-0.904-1.085c-0.245-0.289-0.499-0.569-0.744-0.859s-0.492-0.588-0.736-0.884c-0.045-0.055-0.121-0.085-0.143-0.176z"></path>
  </g>

  <!-- Reticle -->
  <g fill="none" stroke="#60a5fa">
    <circle cx="980" cy="160" r="112" stroke-width="0.7" opacity="0.18"/>
  </g>

  <!-- Title block (left) -->
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" filter="url(#textblur)" opacity="0.7">
    <text x="60" y="90" font-size="18" font-weight="500" fill="#000000" letter-spacing="8">[ COMMANDER  ·  CITY  ·  DUTY ]</text>
    <text x="60" y="150" font-size="66" font-weight="700" fill="#000000" letter-spacing="2">ZAVALA</text>
    <text x="60" y="200" font-size="20" font-weight="500" fill="#000000" letter-spacing="5">AGENT BRAIN  /  WRAPPER</text>
    <text x="62" y="230" font-size="15" font-weight="400" fill="#000000" letter-spacing="4">WE WILL HOLD.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif">
    <text x="60" y="90" font-size="18" font-weight="500" fill="#60a5fa" letter-spacing="8">[ COMMANDER  ·  CITY  ·  DUTY ]</text>
    <text x="60" y="150" font-size="66" font-weight="700" fill="#eff6ff" letter-spacing="2">ZAVALA</text>
    <text x="60" y="200" font-size="20" font-weight="500" fill="#93c5fd" letter-spacing="5">AGENT BRAIN  /  WRAPPER</text>
    <text x="62" y="230" font-size="15" font-weight="400" fill="#8a8a8a" letter-spacing="4">WE WILL <tspan x="166" fill="#60a5fa">HOLD.</tspan></text>
  </g>

  <rect x="60" y="172" width="400" height="1.5" fill="url(#accentfade)"/>

  <text transform="translate(1184, 243) rotate(-90)" font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', sans-serif" font-size="8" font-weight="500" letter-spacing="2" fill="#60a5fa" opacity="0.25">LAST CITY  ·  TOWER  ·  EARTH</text>

  <g fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.5">
    <path d="M 24 46 L 24 24 L 46 24"/>
    <path d="M 1176 274 L 1176 296 L 1154 296"/>
  </g>

  <rect width="360" height="320" fill="url(#leftfade)"/>
  <rect width="1200" height="320" fill="url(#vig)" pointer-events="none"/>
</svg>
